<!DOCTYPE html>
<html lang="ca">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Multimedia</title>
</head>
<body>
	<h1>Multimedia</h1>

	<h2>Video</h2>
	<video controls width="600">
		<source src="video.mp4" type="video/mp4">
	</video>

	<iframe
		width="600"
		height="338"
		src="https://www.youtube.com/embed/U47MvW6VwmA"
		title="Video de YouTube"
		allowfullscreen>
	</iframe>


	<h2>Imagen</h2>
	<img src="image.png" alt="Mi imagen" width="400">

	<h2>Audio</h2>
	<audio controls>
		<source src="audio.mp3" type="audio/mpeg">
		
	</audio>
</body>
</html>
